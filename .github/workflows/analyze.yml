name: Analyze IPA

# Static reverse-engineering of a decrypted Waze IPA, to locate the classes,
# selectors and config keys the tweak needs. Runs on the macOS runner (it can
# reach the file host and ships the Apple toolchain). Installs NOTHING — only
# nm / otool / strings / unzip, which are always present — so it can't fail on
# a missing tool. Nothing is committed to the repo: a compact dump is uploaded
# as a private artifact, and a curated map is printed to the job log.

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Link direct către IPA-ul Waze DECRIPTAT"
        required: true
        type: string
      class_regex:
        description: "Regex (case-insensitive) pentru clase/selectori de interes"
        required: false
        type: string
        default: "ad|advert|promot|banner|sponsor|config|flag|feature|experiment|abtest|setting|speed|limit|alert|report|camera|police|theme|skin|mood|night|dark|navigation|guidance"
      string_regex:
        description: "Regex (case-insensitive) pentru string-uri de configurare"
        required: false
        type: string
        default: "^(config|feature|flag|enable|show|hide|ad_|ads_|speed|limit|camera|alert|report|theme|mood|night|dark)[a-z0-9_.]{2,}$"

concurrency:
  group: analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      IPA_URL: ${{ inputs.ipa_url }}
      CLASS_REGEX: ${{ inputs.class_regex }}
      STRING_REGEX: ${{ inputs.string_regex }}
    steps:
      - name: Mask IPA URL
        run: echo "::add-mask::$IPA_URL"

      - name: Download IPA
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/input.ipa" "$IPA_URL"
          unzip -tq "$RUNNER_TEMP/input.ipa" > /dev/null || { echo "::error::Fișierul descărcat nu este un IPA valid (e link direct? a expirat?)"; exit 1; }

      - name: Locate binary
        run: |
          cd "$RUNNER_TEMP"
          unzip -q input.ipa 'Payload/*'
          APP=$(find Payload -maxdepth 1 -name '*.app' | head -n1)
          test -n "$APP" || { echo "::error::Nu am găsit un .app în Payload"; exit 1; }
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          BIN="$APP/$EXE"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          echo "WAZE_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"
          echo "::group::Binary info"
          echo "Waze $VERSION — $BIN"
          lipo -info "$BIN" || true
          ls -lh "$BIN"
          if otool -l "$BIN" 2>/dev/null | grep -q 'cryptid 1'; then
            echo "::error::Binarul este criptat. Ai nevoie de un IPA decriptat."
            exit 1
          fi
          echo "::endgroup::"

      - name: Extract metadata
        run: |
          cd "$RUNNER_TEMP/out"
          # Obj-C class names (reliable, from symbols).
          nm "$BIN" 2>/dev/null | grep -oE '_OBJC_CLASS_\$_[A-Za-z0-9_]+' | sed 's/_OBJC_CLASS_\$_//' | sort -u > classes.txt
          # Selector (method) names.
          otool -v -s __TEXT __objc_methname "$BIN" 2>/dev/null \
            | awk 'NF>=2 && $1 ~ /^[0-9a-f]+$/ {print $2}' | sort -u > selectors.txt
          # All readable strings.
          strings -a "$BIN" | sort -u > strings.txt
          echo "classes: $(wc -l < classes.txt), selectors: $(wc -l < selectors.txt), strings: $(wc -l < strings.txt)"
          echo "::group::Embedded frameworks"
          ls "$APP/Frameworks" 2>/dev/null || echo "(none)"
          echo "::endgroup::"

      # ---- Curated map printed to the log (readable from here) ----

      - name: Candidate classes
        run: |
          echo "===== CANDIDATE CLASSES ====="
          grep -iE "$CLASS_REGEX" "$RUNNER_TEMP/out/classes.txt" | head -n 400
          echo "===== END CANDIDATE CLASSES ====="

      - name: Candidate selectors
        run: |
          echo "===== CANDIDATE SELECTORS ====="
          grep -iE "$CLASS_REGEX" "$RUNNER_TEMP/out/selectors.txt" | head -n 400
          echo "===== END SELECTORS ====="

      - name: Candidate config strings
        run: |
          echo "===== CANDIDATE CONFIG STRINGS ====="
          grep -iE "$STRING_REGEX" "$RUNNER_TEMP/out/strings.txt" | head -n 400
          echo "===== END CONFIG STRINGS ====="

      - name: Package dump
        run: tar -czf "$RUNNER_TEMP/WazeDump-$WAZE_VERSION.tar.gz" -C "$RUNNER_TEMP" out

      - uses: actions/upload-artifact@v4
        with:
          name: WazeDump-${{ env.WAZE_VERSION }}
          path: ${{ runner.temp }}/WazeDump-${{ env.WAZE_VERSION }}.tar.gz
          retention-days: 7
