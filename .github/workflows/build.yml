name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      THEOS: ${{ github.workspace }}/../theos
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ldid make

      - name: Clone Theos
        timeout-minutes: 5
        run: git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"

      - name: Download iOS 16.5 SDK
        timeout-minutes: 10
        run: |
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" "sdks-master/iPhoneOS16.5.sdk"
          mv "$RUNNER_TEMP/sdks-master/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls "$THEOS/sdks"

      - name: Build package
        run: gmake package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: WazePatch
          path: packages/*.deb
