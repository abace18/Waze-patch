name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ldid make xz

      - name: Set up Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          git -C "$RUNNER_TEMP/sdks" sparse-checkout set iPhoneOS16.5.sdk
          mv "$RUNNER_TEMP/sdks/iPhoneOS16.5.sdk" "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: gmake package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: WazePatch
          path: packages/*.deb

      # ---- Sileo/Zebra APT repo, published to GitHub Pages (main only) ----
      - name: Build APT repo
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p repo/debs
          cp packages/*.deb repo/debs/
          cd repo
          DEB=$(ls debs/*.deb | head -n1)
          echo "Packaging $DEB"
          {
            grep -vE '^[[:space:]]*$' "$GITHUB_WORKSPACE/control"
            echo "Filename: ./$DEB"
            echo "Size: $(stat -f%z "$DEB")"
            echo "MD5sum: $(md5 -q "$DEB")"
            echo "SHA1: $(shasum -a 1 "$DEB" | cut -d' ' -f1)"
            echo "SHA256: $(shasum -a 256 "$DEB" | cut -d' ' -f1)"
            echo
          } > Packages
          gzip -9kf Packages
          bzip2 -9kf Packages
          xz -9kf Packages
          printf 'Origin: WazePatch\nLabel: WazePatch\nSuite: stable\nVersion: 1.0\nCodename: ios\nArchitectures: iphoneos-arm64\nComponents: main\nDescription: Imbunatatiri pentru Waze (telefon + CarPlay)\n' > Release
          cp "$GITHUB_WORKSPACE/.github/pages/index.html" index.html 2>/dev/null || true
          echo "--- repo contents ---"
          ls -lR

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
